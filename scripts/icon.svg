      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="22" y="26" width="9" height="40" rx="4.5" fill="#fbbf24"/>
  <rect x="40" y="26" width="66" height="14" rx="7" fill="#fff"/>
  <rect x="40" y="52" width="48" height="14" rx="7" fill="#fff" fill-opacity="0.6"/>
  <rect x="40" y="80" width="56" height="12" rx="6" fill="#fff" fill-opacity="0.85"/>
  <rect x="40" y="100" width="38" height="12" rx="6" fill="#fff" fill-opacity="0.45"/>
</svg>
